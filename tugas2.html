    <style>
        /* =========================================================
           FIXED CUSTOM CSS FOR CAROUSEL SLIDER & LIGHTBOX MODAL
           ========================================================= */
        
        .photo-slider-wrapper {
            position: relative;
            width: 180px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1;
        }

        .photo-slider-container {
            display: flex;
            width: 100%;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            border-radius: 14px;
            scrollbar-width: none;
            -ms-overflow-style: none;
            position: relative;
            z-index: 2;
        }

        .photo-slider-container::-webkit-scrollbar {
            display: none;
        }

        .photo-slide {
            flex: 0 0 100%;
            scroll-snap-align: center;
            position: relative;
            cursor: pointer;
        }

        .photo-slide img {
            width: 180px !important;
            height: 230px !important;
            border-radius: 14px;
            object-fit: cover;
            display: block;
            border: 2px solid rgba(56, 189, 248, 0.4);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
            transition: all 0.3s ease;
            pointer-events: auto;
        }

        .photo-slide:hover img {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.5);
        }

        /* Panah Navigasi Slider - Dipastikan Teratas & Bisa Dipencet */
        .slider-nav {
            position: absolute;
            top: 45%;
            transform: translateY(-50%);
            background: rgba(15, 23, 42, 0.9);
            color: var(--accent-cyan);
            border: 1px solid var(--accent-cyan);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.9rem;
            z-index: 20; /* Nilai Z-Index Tinggi */
            transition: all 0.2s ease;
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
            user-select: none;
        }

        .slider-nav:hover {
            background: var(--accent-cyan);
            color: #0b0f19;
            box-shadow: 0 0 15px var(--accent-cyan);
            transform: translateY(-50%) scale(1.1);
        }

        .slider-nav.prev { left: -14px; }
        .slider-nav.next { right: -14px; }

        /* Titik Indikator Dots */
        .slider-dots-container {
            display: flex;
            gap: 6px;
            margin-top: 10px;
            z-index: 10;
        }

        .slider-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .slider-dot.active {
            background: var(--accent-cyan);
            width: 18px;
            border-radius: 10px;
            box-shadow: 0 0 8px var(--accent-cyan);
        }

        /* Modal Zoom Foto / Lightbox */
        #lightboxModal {
            display: none;
            position: fixed;
            z-index: 99999;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(11, 15, 25, 0.92);
            backdrop-filter: blur(12px);
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        #lightboxImg {
            max-width: 90%;
            max-height: 80vh;
            border-radius: 16px;
            border: 2px solid var(--accent-cyan);
            box-shadow: 0 0 40px rgba(56, 189, 248, 0.4);
            object-fit: contain;
        }

        #closeLightbox {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 2.2rem;
            color: #fff;
            cursor: pointer;
            font-family: 'Fira Code', monospace;
            transition: color 0.2s;
            z-index: 100000;
        }

        #closeLightbox:hover {
            color: var(--accent-pink);
        }

        /* Styling Tombol Media Sosial */
        .social-buttons-wrapper {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .social-btn {
            padding: 8px 14px;
            border-radius: 8px;
            text-decoration: none;
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
            position: relative;
            z-index: 10;
        }

        .social-btn.tiktok {
            background: linear-gradient(135deg, rgba(244, 63, 94, 0.15), rgba(56, 189, 248, 0.15));
            color: var(--text-main);
            border: 1px solid rgba(244, 63, 94, 0.3);
        }

        .social-btn.tiktok:hover {
            background: linear-gradient(135deg, #f43f5e, #38bdf8);
            color: #fff;
            box-shadow: 0 0 15px rgba(244, 63, 94, 0.4);
            transform: translateY(-2px);
        }

        .social-btn.instagram {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.15), rgba(244, 63, 94, 0.15));
            color: var(--text-main);
            border: 1px solid rgba(168, 85, 247, 0.3);
        }

        .social-btn.instagram:hover {
            background: linear-gradient(135deg, #a855f7, #f43f5e);
            color: #fff;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
            transform: translateY(-2px);
        }

        .interactive-btn {
            position: relative;
            z-index: 10;
        }
    </style>
</head>
<body>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // 1. CAROUSEL SLIDER LOGIC
            const sliderContainer = document.getElementById("photoSliderContainer");
            const btnPrevSlide = document.getElementById("btnPrevSlide");
            const btnNextSlide = document.getElementById("btnNextSlide");
            const dots = document.querySelectorAll(".slider-dot");
            const slides = document.querySelectorAll(".photo-slide");

            function scrollToSlideIndex(index) {
                if(!slides[0]) return;
                const slideWidth = slides[0].clientWidth;
                sliderContainer.scrollTo({
                    left: slideWidth * index,
                    behavior: "smooth"
                });
                updateDotsActive(index);
            }

            function updateDotsActive(activeIndex) {
                dots.forEach((dot, idx) => {
                    if (idx === activeIndex) {
                        dot.classList.add("active");
                    } else {
                        dot.classList.remove("active");
                    }
                });
            }

            btnPrevSlide.addEventListener("click", (e) => {
                e.stopPropagation();
                const currentScroll = sliderContainer.scrollLeft;
                const slideWidth = slides[0].clientWidth;
                const currentIndex = Math.round(currentScroll / slideWidth);
                const targetIndex = currentIndex > 0 ? currentIndex - 1 : slides.length - 1;
                scrollToSlideIndex(targetIndex);
            });

            btnNextSlide.addEventListener("click", (e) => {
                e.stopPropagation();
                const currentScroll = sliderContainer.scrollLeft;
                const slideWidth = slides[0].clientWidth;
                const currentIndex = Math.round(currentScroll / slideWidth);
                const targetIndex = currentIndex < slides.length - 1 ? currentIndex + 1 : 0;
                scrollToSlideIndex(targetIndex);
            });

            dots.forEach(dot => {
                dot.addEventListener("click", (e) => {
                    e.stopPropagation();
                    const index = parseInt(e.target.dataset.index);
                    scrollToSlideIndex(index);
                });
            });

            sliderContainer.addEventListener("scroll", () => {
                const currentScroll = sliderContainer.scrollLeft;
                const slideWidth = slides[0].clientWidth;
                const activeIndex = Math.round(currentScroll / slideWidth);
                updateDotsActive(activeIndex);
            });

            // 2. LIGHTBOX ZOOM LOGIC
            const lightboxModal = document.getElementById("lightboxModal");
            const lightboxImg = document.getElementById("lightboxImg");
            const closeLightbox = document.getElementById("closeLightbox");
            const zoomImgs = document.querySelectorAll(".zoom-img");

            zoomImgs.forEach(img => {
                img.addEventListener("click", () => {
                    lightboxModal.style.display = "flex";
                    lightboxImg.src = img.src;
                });
            });

            closeLightbox.addEventListener("click", () => {
                lightboxModal.style.display = "none";
            });

            lightboxModal.addEventListener("click", (e) => {
                if (e.target === lightboxModal) {
                    lightboxModal.style.display = "none";
                }
            });

            // 3. KATEGORI MENU INTERAKTIF LOGIC
            const dataHobi = ["Bermain Game", "Membaca Buku"];
            const dataLangkah = ["Pacaran", "Mbajing", "Ngoding"];
            const dataCita = ["Hidup tenang tanpa beban"];

            const btnHobi = document.getElementById("btnHobi");
            const btnLangkah = document.getElementById("btnLangkah");
            const btnCita = document.getElementById("btnCita");
            
            const displayBox = document.getElementById("displayBox");
            const displayTitle = document.getElementById("displayTitle");
            const displayContent = document.getElementById("displayContent");

            btnHobi.addEventListener("click", () => {
                displayBox.style.display = "block";
                displayTitle.textContent = "> Detail Hobi:";
                displayContent.textContent = dataHobi.join(", ");
            });

            btnLangkah.addEventListener("click", () => {
                displayBox.style.display = "block";
                displayTitle.textContent = "> Detail Langkah Harian:";
                displayContent.textContent = dataLangkah.join(", ");
            });

            btnCita.addEventListener("click", () => {
                displayBox.style.display = "block";
                displayTitle.textContent = "> Detail Cita-cita:";
                displayContent.textContent = dataCita.join(", ");
            });
        });
    </script>
